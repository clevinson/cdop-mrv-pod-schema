# CDOP MRV pod schema — 2026-09-24 revision (CarbonAi pass on Cory's 0.1.0 LinkML port).
# Changes from 0.1.0:
#   - Typed values: new QuantityValue (value + unit) replaces number-in-a-string and the open JSON blobs.
#   - Three tiers under MonitoringScope, as keyed siblings: static_values, measurements, results.
#   - MonitoringResult renamed to Measurement (the observed value). "Result" is now a computed output.
#   - Result composes inputs (a static value, a measurement, or another result) into an output.
#   - Plans, measurements, results, static values are keyed and referenced, not matched on free text.
#   - Evidence is a typed object inlined on the input it belongs to (measurement or static value).
#   - ReportingPeriod is a keyed class, so more than one period can be held and referenced.
#   - monitoring_parameter is a methodology-scoped string, not a closed forest enum.
#   - Units live on QuantityValue (UCUM where possible); unit_type/unit_symbol enums removed.
#   - Removed: the input/output data and variables JSON blobs (the typed tiers replace them).
# Also since 0.1.0: methodology is a structured {id, version, link}; vintage lives on ReportingPeriod;
#   measurements are timestamped rather than tied to a period; and change_type, compliance_result, and the
#   unit_type/unit_symbol picklists were dropped.
# Forest-specific fields (calculation_worksheet, hwp_worksheet, chain_of_custody, assessment_area) are
#   retained but flagged with methodology_scope for the pod to decide whether to keep. Location is out of
#   scope here (covered by CDOP's Location schema).
# Pairs with the updated workbook. This is a draft for discussion with the pod.
id: https://clevinson.github.io/cdop-mrv-pod-schema/schema/
name: mrv_pod
title: CDOP MRV Pod
description: >-
  A shared reference for the CDOP MRV pod's monitoring, reporting and verification data.
  A project has reporting context, a verification schedule, and a monitoring scope. The
  monitoring scope holds monitoring plans, static values, measurements, and results as
  keyed collections that reference each other. Measurements are observed values, results
  are computed from measurements and static values, and both carry typed quantities with
  units. This is a draft for discussion and refinement with the pod.
version: 0.2.7
prefixes:
  linkml: https://w3id.org/linkml/
  cdop-mrv: https://clevinson.github.io/cdop-mrv-pod-schema/schema/
default_prefix: cdop-mrv
default_range: string
imports:
  - linkml:types

# Classes and their fields. data_source / public_private / mutability / pre_issuance annotations
# describe policy; they do not enforce it.
classes:

  # --- Project ---
  Project:
    description: "A project with its reporting context, verification schedule and monitoring scope."
    tree_root: true
    attributes:
      id:
        description: "Stable project identifier."
        identifier: true
        range: string
        annotations:
          data_source: "Registry / Project Developer"
          public_private: "Public"
          mutability: "Immutable"
      assessment_area:
        description: "Eligibility context (Assessment Area / Supersection), if applicable."
        range: string
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
          mutability: "Immutable"
          pre_issuance: "Yes"
          methodology_scope: "forest-specific"
        notes:
          - "Assessment Area and Supersection are forest-protocol eligibility terms; this is not a general project location."
          - "Flagged methodology-specific; proposed for removal pending pod decision."
      reporting:
        description: "Reporting context: periods, preparer, completion date."
        range: ReportingContext
        required: true
        inlined: true
        annotations:
          data_source: "Project Developer"
          public_private: "Public / Private"
          mutability: "Mutable"
      reporting_periods:
        description: "The reporting periods for the project. Results reference one by id."
        range: ReportingPeriod
        multivalued: true
        inlined: true
        inlined_as_list: true
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
          mutability: "Immutable"
      verification_schedule:
        description: "Key dates in the verification process."
        range: VerificationSchedule
        required: true
        inlined: true
        annotations:
          data_source: "Verification Body"
          public_private: "Public"
          mutability: "Mutable"
      monitoring:
        description: "Monitoring plans, static values, measurements and results for the project."
        range: MonitoringScope
        required: true
        inlined: true
        annotations:
          data_source: "Project Developer / Project Proponent"
          public_private: "Public"
          mutability: "Mutable"
      attestation:
        description: >-
          Optional project attestation. When present, all required Attestation fields must be supplied.
        range: Attestation
        inlined: true
      methodology:
        description: "The methodology governing the project, as identifier and version."
        range: Methodology
        required: true
        inlined: true
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
          mutability: "Immutable"
          pre_issuance: "Yes"

  # --- ReportingContext ---
  ReportingContext:
    description: "Reporting periods and report preparation details."
    attributes:
      current_period:
        description: "The reporting period this report covers. References a ReportingPeriod by id."
        range: ReportingPeriod
        required: true
        inlined: false
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
          mutability: "Immutable"
      initial_period:
        description: "The project's first reporting period. References a ReportingPeriod by id."
        range: ReportingPeriod
        required: true
        inlined: false
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
          mutability: "Immutable"
      report_preparer:
        description: "Individual completing the report."
        range: string
        required: true
        annotations:
          data_source: "Project Developer"
          public_private: "Private"
          mutability: "Mutable"
      report_completion_date:
        description: "Date the report was completed."
        range: date
        required: true
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
          mutability: "Mutable"

  # --- ReportingPeriod ---
  ReportingPeriod:
    description: "A named reporting period. Referenced by results; a project can hold more than one."
    attributes:
      id:
        description: "Stable period identifier."
        identifier: true
        range: string
      label:
        description: "Human label for the period, e.g. '2026 annual'."
        range: string
      date_range:
        description: "Start and end dates of the monitoring window for the period."
        range: DateRange
        required: true
        inlined: true
      vintage:
        description: "The vintage period the outcomes for this period are attributed to. Distinct from the monitoring window."
        range: DateRange
        inlined: true

  # --- VerificationSchedule ---
  VerificationSchedule:
    description: "Dates of completed and planned verification."
    attributes:
      last_verification_date:
        description: "Completion date of the last verification."
        range: date
        required: true
        annotations:
          data_source: "Verification Body"
          public_private: "Public"
          mutability: "Mutable"
      next_verification_date:
        description: "Date of the next planned verification."
        range: date
        required: true
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
          mutability: "Mutable"

  # --- Attestation ---
  Attestation:
    description: "Signed attestation by the project proponent."
    attributes:
      signature:
        description: "Signed attestation by the project proponent."
        range: uri
        required: true
        annotations:
          data_source: "Project Proponent"
          public_private: "Private"
          mutability: "Immutable"
      signatory_name:
        description: "Name of the signatory."
        range: string
        required: true
        annotations:
          data_source: "Project Proponent"
          public_private: "Public"
      signatory_title:
        description: "Title of the signatory."
        range: string
        required: true
        annotations:
          data_source: "Project Proponent"
          public_private: "Public"
      signatory_organization:
        description: "Organization of the signatory."
        range: string
        required: true
        annotations:
          data_source: "Project Proponent"
          public_private: "Public"
      date:
        description: "Date signed."
        range: date
        required: true
        annotations:
          data_source: "Project Proponent"
          public_private: "Public"

  # --- MonitoringScope ---
  MonitoringScope:
    description: "Monitoring plans, static values, measurements and results for a project."
    attributes:
      requirement_categories_monitored:
        description: "Standardized set of protocol requirement categories the project monitors."
        range: string
        required: true
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
          mutability: "Mutable"
          pre_issuance: "Yes"
      methods_used_to_monitor:
        description: "Protocol, tools, and methods used to monitor."
        range: string
        required: true
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
          mutability: "Mutable"
          pre_issuance: "Yes"
      calculation_worksheet:
        description: "The Annual Monitoring Calculation Worksheet that accompanies the monitoring report."
        range: uri
        annotations:
          data_source: "Project Developer"
          public_private: "Private"
          mutability: "Mutable"
          methodology_scope: "forest / material-flow specific"
        notes:
          - "Required when seeking forest-registry credits."
          - "Flagged methodology-specific; proposed for removal pending pod decision."
      hwp_worksheet:
        description: "The Harvested Wood Products worksheet required by a forest protocol."
        range: uri
        annotations:
          data_source: "Project Developer"
          public_private: "Private"
          mutability: "Mutable"
          methodology_scope: "forest-specific"
        notes:
          - "Flagged methodology-specific; proposed for removal pending pod decision."
      chain_of_custody_and_application_evidence:
        description: >-
          Documents tracing the monitored material from feedstock sourcing through production and final application.
        range: uri
        multivalued: true
        annotations:
          data_source: "Project Developer"
          public_private: "Private"
          mutability: "Mutable"
          methodology_scope: "material-flow specific"
        notes:
          - "Required where applicable."
          - "Flagged methodology-specific; proposed for removal pending pod decision."
      monitoring_plans:
        description: "Monitoring plans, one per monitored parameter. Keyed; referenced by measurements and results."
        range: MonitoringPlan
        multivalued: true
        inlined: true
        inlined_as_list: true
      static_values:
        description: "Fixed inputs that are not measured each period: methodology constants and defaults, and ex-ante parameters including baseline. Keyed; referenced by results."
        range: StaticValue
        multivalued: true
        inlined: true
        inlined_as_list: true
      measurements:
        description: "Observed values for a monitored parameter, each timestamped. Keyed; reference a plan."
        range: Measurement
        multivalued: true
        inlined: true
        inlined_as_list: true
      results:
        description: "Computed outputs. Each is produced from inputs that are static values, measurements, or other results."
        range: Result
        multivalued: true
        inlined: true
        inlined_as_list: true

  # --- MonitoringPlan ---
  MonitoringPlan:
    description: "The monitoring plan for one protocol requirement or carbon metric. Stands on its own so it can be referenced across project phases without being restated."
    attributes:
      id:
        description: "Stable plan identifier. Referenced by measurements and results."
        identifier: true
        range: string
      monitoring_parameter:
        description: >-
          The parameter being monitored, as the methodology's own parameter key or name. Not a
          closed CDOP list; sourced from the methodology.
        range: string
        required: true
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
          mutability: "Mutable"
          pre_issuance: "Yes"
      overview_of_status:
        description: "Description of the project's status and approach for this parameter."
        range: string
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
      approach_to_monitor:
        description: "The measuring and monitoring plan for this parameter."
        range: string
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
      indicator_id:
        description: "IDs distinguishing indicators within one parameter (e.g. each pool, each risk category)."
        range: string
        multivalued: true
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
      expected_unit:
        description: "The unit the indicator is expected to be reported in (UCUM where possible). Measured values carry the actual unit on their QuantityValue."
        range: string
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
      monitoring_frequency:
        description: "How often the indicator is measured."
        range: MonitoringFrequency
        multivalued: true
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
      required_threshold:
        description: "Protocol threshold the indicator is measured against (e.g. '>=95%', 'N/A')."
        range: string
        multivalued: true
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
      supporting_evidence:
        description: "Evidence supporting the plan (e.g. inventory report, management plan, certificate)."
        range: Evidence
        multivalued: true
        inlined: true
        inlined_as_list: true
      equation_reference:
        description: >-
          Methodology equation(s) in which the indicator is used as an input or produced as an output.
        range: string
        multivalued: true
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
      source_of_data:
        description: >-
          Origin of the data used for the indicator (on-site measurement, lab, records, methodology default, etc.).
        range: string
        required: true
        multivalued: true
        minimum_cardinality: 1
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
      qa_qc_procedures:
        description: "Procedures used to confirm accuracy, completeness and integrity of the indicator."
        range: string
        required: true
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
      purpose_of_data:
        description: "Reason the indicator is required under the methodology."
        range: string
        required: true
        multivalued: true
        minimum_cardinality: 1
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
      calculation_method:
        description: "Described method or procedure used to convert source data into the indicator or result. Computed results are modeled explicitly in Result."
        range: string
        annotations:
          data_source: "Project Developer"
          public_private: "Public"

  # --- StaticValue ---
  StaticValue:
    description: >-
      A fixed input that is not measured each period. Methodology constants and defaults, and ex-ante
      project parameters set at validation, including baseline. Carries source and validity.
    attributes:
      id:
        description: "Stable identifier. Referenced by results as an input."
        identifier: true
        range: string
      label:
        description: "What this value is, e.g. 'net calorific value of fuel' or 'baseline fuel use'."
        range: string
        required: true
      parameter:
        description: "Optional methodology parameter key this value relates to."
        range: string
      value:
        description: "The typed value and its unit."
        range: QuantityValue
        required: true
      kind:
        description: "Whether this is a methodology default, an ex-ante parameter, or a baseline."
        range: StaticValueKind
        annotations:
          public_private: "Public"
      source:
        description: "Where the value comes from, e.g. a named methodology tool and version."
        range: string
        annotations:
          data_source: "Project Developer"
          public_private: "Public"
      valid_from:
        description: "Start of the validity period for this value, where applicable."
        range: date
      valid_to:
        description: "End of the validity period for this value, where applicable."
        range: date
      evidence:
        description: "Evidence backing this value, inlined."
        range: Evidence
        multivalued: true
        inlined: true
        inlined_as_list: true

  # --- Measurement ---
  Measurement:
    description: "An observed value for a monitored parameter at a point in time. Was MonitoringResult in 0.1.0."
    attributes:
      id:
        description: "Stable identifier. Referenced by results as an input."
        identifier: true
        range: string
      plan:
        description: "The monitoring plan this measures. References a MonitoringPlan by id."
        range: MonitoringPlan
        required: true
        inlined: false
      indicator_id:
        description: "Which indicator within the plan this measures, where a plan has several."
        range: string
      timestamp:
        description: "When the measurement was taken. The reporting period it falls in is derivable from this."
        range: datetime
        required: true
        annotations:
          data_source: "Project Proponent"
          public_private: "Public"
      value:
        description: "The measured value and its unit."
        range: QuantityValue
        required: true
        annotations:
          data_source: "Project Proponent"
          public_private: "Public"
          mutability: "Mutable"
      source:
        description: "Origin of this measurement (device, survey, record)."
        range: string
        annotations:
          data_source: "Project Proponent"
          public_private: "Public"
      note:
        description: "Optional narrative about the observation."
        range: string
      evidence:
        description: "Evidence backing this measurement, inlined."
        range: Evidence
        multivalued: true
        inlined: true
        inlined_as_list: true

  # --- Result ---
  Result:
    description: >-
      A computed output. Produced from inputs, where an input is a static value, a measurement, or
      another result. Chaining results expresses intermediate steps (e.g. baseline emissions, project
      emissions, leakage) up to a final value.
    attributes:
      id:
        description: "Stable identifier. May be referenced as an input by other results."
        identifier: true
        range: string
      label:
        description: "What this result is, e.g. 'baseline emissions' or 'net emission reductions'."
        range: string
        required: true
      parameter:
        description: "Optional methodology parameter key this result corresponds to."
        range: string
      period:
        description: "The reporting period this result is for. References a ReportingPeriod by id."
        range: ReportingPeriod
        inlined: false
      inputs:
        description: "The inputs consumed to produce the output."
        range: ResultInput
        multivalued: true
        inlined: true
        inlined_as_list: true
      output:
        description: "The computed value and its unit."
        range: QuantityValue
        required: true
        annotations:
          data_source: "Project Proponent"
          public_private: "Public"
      equation_reference:
        description: "The methodology equation this result applies."
        range: string
      narrative_or_explanation:
        description: "Narrative for this result."
        range: string

  # --- ResultInput ---
  ResultInput:
    description: "One input to a Result: a reference to a static value, a measurement, or another result."
    attributes:
      kind:
        description: "Which kind of thing this input references."
        range: InputKind
        required: true
      ref:
        description: "The id of the referenced StaticValue, Measurement, or Result."
        range: string
        required: true
      variable:
        description: "Optional role this input plays in the equation, e.g. the methodology symbol."
        range: string

  # --- Evidence ---
  Evidence:
    description: "A typed piece of evidence, inlined on the measurement or static value it backs."
    attributes:
      kind:
        description: "The kind of evidence."
        range: EvidenceKind
        required: true
      reference:
        description: "A uri for a file, or an id or locator for a stream or record. Read according to kind."
        range: string
        required: true
      description:
        description: "What the evidence is."
        range: string
      collected_at:
        description: "When the evidence was captured or produced."
        range: datetime
      hash:
        description: "Optional integrity hash of the referenced evidence."
        range: string

  # --- QuantityValue ---
  QuantityValue:
    description: "A typed numeric value with its unit."
    attributes:
      value:
        description: "The numeric value."
        range: decimal
        required: true
      unit:
        description: "The unit, as a UCUM code where possible, otherwise a methodology-declared unit."
        range: string
        required: true

  # --- DateRange ---
  DateRange:
    description: "A date range. Chronological ordering is not validated."
    attributes:
      start_date:
        description: "Start date."
        range: date
        required: true
      end_date:
        description: "End date."
        range: date
        required: true

  # --- Methodology ---
  Methodology:
    description: "A methodology identity and version."
    attributes:
      id:
        description: "Methodology identifier, e.g. VM0044."
        range: string
        required: true
      version:
        description: "Methodology version, e.g. 1.2."
        range: string
        required: true
      link:
        description: "Link to the methodology, where available."
        range: uri

# Enums. Bounded, cross-methodology vocabularies. Parameter and unit vocabularies are NOT enumerated
# here; parameters come from the methodology and units live on QuantityValue.
enums:
  MonitoringFrequency:
    description: "How often an indicator is measured."
    permissible_values:
      "Continuous": {}
      "Annually": {}
      "Per reporting period": {}
      "Every site visit": {}
      "Every 12 periods": {}
      "Sporadically": {}
      "Other": {}
  InputKind:
    description: "The kind of thing a ResultInput references."
    permissible_values:
      "static": { description: "A StaticValue." }
      "measurement": { description: "A Measurement." }
      "result": { description: "Another Result." }
  StaticValueKind:
    description: "The kind of static value."
    permissible_values:
      "methodology_default": { description: "A constant or default fixed by the methodology." }
      "ex_ante_parameter": { description: "A project parameter set once at validation." }
      "baseline": { description: "A baseline value." }
  EvidenceKind:
    description: "The kind of evidence. Starter set; extend as needed."
    permissible_values:
      "document": {}
      "sensor_stream": {}
      "survey_response": {}
      "lab_result": {}
      "photograph": {}
      "external_record": {}
      "attestation": {}
