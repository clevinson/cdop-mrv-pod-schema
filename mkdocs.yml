site_name: CDOP MRV Pod
site_url: https://clevinson.github.io/cdop-mrv-pod-schema/
site_description: A shared reference for the CDOP MRV pod's monitoring, reporting and verification data
docs_dir: build/docs
site_dir: build/site
theme:
  name: material
  features:
    - content.code.copy
plugins:
  - search
markdown_extensions:
  - tables
  - md_in_html
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Overview: index.md
  - Project: schema/classes/Project.md
  - Monitoring plan: schema/classes/MonitoringPlan.md
  - Monitoring result: schema/classes/MonitoringResult.md
  - Downloads:
      - LinkML YAML: schema/mrv-pod.yaml
      - JSON Schema: schema/mrv-pod.schema.json
